<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- <script src="https://cdn.jsdelivr.net/gh/magiclen/tw-nhi-icc/dist/tw-nhi-icc.min.js"></script> -->
        <script src="./dist/tw-nhi-icc.min.js"></script>
        <title>TW NHI IC Card</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <style>
            #ta {
                height: auto;
                font-family: monospace, monospace;
            }
        </style>
    </head>

    <body class="p-3 p-lg-5">
        <div class="form-floating">
            <textarea id="ta" class="form-control" rows="20" readonly></textarea>
            <label id="tal" for="ta">與 TW NHI IC Card Service 建立連線中……</label>
        </div>

        <script>
            const tal = document.getElementById("tal");
            const ta = document.getElementById("ta");

            // `Date` 以台灣時區的日期顯示，不然 `JSON.stringify` 會顯示成前一天的 UTC 時間
            const replacer = function (key, value) {
                const original = this[key];

                if (original instanceof Date) {
                    return original.toLocaleDateString("zh-TW", { timeZone: "Asia/Taipei" });
                }

                return value;
            };

            const service = new TWNHIICC.TWNHIICCService();

            service.watch({
                onSnapshot: (snapshot) => {
                    ta.value = JSON.stringify(snapshot, replacer, 4);
                },
                onConnectionChange: (connected) => {
                    if (connected) {
                        tal.textContent = "讀卡機狀態";
                    } else {
                        ta.value = "";
                        tal.textContent = "與 TW NHI IC Card Service 重新連線中……";
                    }
                },
            });
        </script>
    </body>
</html>
